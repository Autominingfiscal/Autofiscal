; ===== DASHBOARD FLUIG - CONFIGURACAO =====
; As palavras abaixo valem sem acento e sem diferenca de maiusculas.
; Rode "Ver diagnostico" para ver os valores que vieram na planilha.

[geral]
; Exportacao do Fluig. Pode usar * : vale o arquivo mais recente que bater.
planilha = %USERPROFILE%\Downloads\Resultado da consulta de solicita*.xlsx

[situacao]
; Coluna "Situacao da Solicitacao": basta o valor CONTER uma das palavras.
finalizada = FINALIZ, CONCLU
cancelada = CANCEL
aberta = ABERT, ANDAMENTO, PENDENT

[aprovacao]
; Coluna "aprovacao": reprovada se CONTER uma destas palavras...
reprovada = REPROV, RECUS
; ...ou se for exatamente um destes valores
reprovada_se_igual = NAO, N, FALSE, 0

[categorias]
; numero = nome no dashboard | palavras
; Procura nas colunas tipo_nota, tipo_documento_nota e tipoContrato. Vale a
; PRIMEIRA regra (pela ordem do numero) com alguma palavra que COMECE com uma
; das palavras dela. O que nao bater em nenhuma vai para "Outros".
1 = Fornecimento de energia (ONS) | ONS, ENERGIA
2 = CTE Rodogranel | CTE, CONHECIMENTO, RODOGRANEL
3 = Produtos gerais | PRODUT, MATERIA, MERCADORIA
4 = Serviço | SERVI

[colunas]
; So mude se o Fluig trocar o nome de alguma coluna na exportacao.
; Vazio = nome padrao.
solicitacao =
situacao =
inicio =
fim =
tecnico =
aprovacao =
fornecedor =
cnpj =
valor =
tipo_nota =
tipo_documento =
tipo_contrato =
